name: CD Pipeline (Production Deploy)

on:
  push:
    branches: [ main ]

jobs:
  deploy-production:
    name: Deploy to Production & Post-Deploy Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Vercel
        id: vercel-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./

      - name: Post-Deploy Smoke Test
        run: |
          echo "Post-deploy health check..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://djcannix.be || curl -s -o /dev/null -w "%{http_code}" ${{ steps.vercel-deploy.outputs.preview-url }})
          if [ "$STATUS" -ne 200 ]; then
            echo "PRODUCTION SMOKE TEST FAILED! HTTP Status: $STATUS"
            exit 1
          fi
          echo "Production site is live and healthy! HTTP 200 OK."
    
