name: QA - Visual Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-tests:
    name: Visual Regression (Chromatic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production UI
        run: npm run build

      # Chromatic is enabled automatically once Storybook and its project token exist.
      - name: Publish Storybook to Chromatic
        if: ${{ hashFiles('.storybook/**', 'storybook/**') != '' }}
        uses: chromaui/action@v17
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          exitOnceUploaded: true
          autoAcceptChanges: main
