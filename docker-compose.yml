services:
  web:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_TO: ${MAIL_TO:-bookings@cannix.be}
      MAIL_FROM: ${MAIL_FROM:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
